definitions:
  AuthHandler.UserCredential:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  collection.NewCollection:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
info:
  contact: {}
  description: API for interacting with the media server
  title: Media Server API
  version: "0.1"
paths:
  /auth/me:
    get:
      description: Returns the authenticated user's UUID, username, and account creation
        timestamp. Requires a valid auth_token cookie.
      produces:
      - application/json
      responses:
        "200":
          description: uuid, username, created_at
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get current user info
      tags:
      - Auth
  /gms/collection:
    get:
      description: Query for all available collections to a specific user by the parameter
        specified
      parameters:
      - description: What attributes are wanted in the response
        in: query
        name: want
        required: true
        type: string
      - description: Offsets from the first response table order
        in: query
        name: offset
        type: integer
      - description: How many entries is wanted in the response
        in: query
        name: limit
        type: integer
      produces:
      - text/plain
      responses:
        "200":
          description: OK
      summary: Query for available collections
      tags:
      - Query
    post:
      description: Create a new collection entry with a specified name and description
      parameters:
      - description: The collection data to create
        in: body
        name: collection
        required: true
        schema:
          $ref: '#/definitions/collection.NewCollection'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/collection.NewCollection'
      summary: Create a new collection
      tags:
      - Creation
  /gms/media:
    get:
      description: Query for media available to a user
      parameters:
      - description: Offset from the first of an ordered list
        in: query
        name: offset
        type: integer
      - description: Limit the number of entries returned
        in: query
        name: limit
        type: integer
      - description: Which order is it in
        in: query
        name: order
        type: string
      - description: Which attribute are the entries ordered by
        in: query
        name: by
        type: string
      - description: Which attributes are wanted in the response
        in: query
        name: want
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Query for media test for changs
      tags:
      - Query
    post:
      consumes:
      - multipart/form-data
      description: Upload images via form data in the field "files"
      produces:
      - text/plain
      responses:
        "200":
          description: OK
      summary: Upload images
      tags:
      - Creation
  /gms/media/{type}/{id}:
    get:
      description: Retrieve a media file by its UUID and type. Returns the file via
        X-Accel-Redirect (served by nginx). Returns 403 if the authenticated user
        does not own the media.
      parameters:
      - description: Media type (e.g. thumbnail, original)
        in: path
        name: type
        required: true
        type: string
      - description: UUID of the media item
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
        "404":
          description: Not Found
      summary: Get media file by ID
      tags:
      - Query
  /gms/media/query:
    post:
      description: Query for by word or filter
      parameters:
      - description: Text to search for
        in: query
        name: text_query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Query media
      tags:
      - Query
  /gms/media/suggestions:
    get:
      description: Query for media similar to a specified uuid
      parameters:
      - description: uuid of the root media
        in: query
        name: uuid
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Get media suggestions
      tags:
      - Query
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate with username and password. Sets an HttpOnly cookie
        named auth_token (JWT, 7-day expiry) on success and returns the user UUID.
      parameters:
      - description: Username and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/AuthHandler.UserCredential'
      produces:
      - application/json
      responses:
        "200":
          description: userid field contains the user UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Log in
      tags:
      - Auth
  /signup:
    post:
      consumes:
      - application/json
      description: Create a new user account with a username and password. Also creates
        a default collection for the user. Returns 201 on success.
      parameters:
      - description: Username and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/AuthHandler.UserCredential'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Register a new user
      tags:
      - Auth
swagger: "2.0"
