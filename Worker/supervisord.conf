[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:worker-thumbnails]
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=python scripts/thumbnail_worker.py
autostart=true
autorestart=true

[program:worker-vectorgeneration]
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=python scripts/async_embedding_worker.py
autostart=true
autorestart=true


[program:worker-vector-api]
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=uvicorn scripts.sync_embedding_api:app --host 0.0.0.0 --port 8001
autostart=true
autorestart=true