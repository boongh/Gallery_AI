[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:worker-thumbnails]
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=python scripts/thumbnail.py
autostart=true
autorestart=true

[program:worker-vectorgeneration]
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=python scripts/embedding_worker.py
autostart=true
autorestart=true